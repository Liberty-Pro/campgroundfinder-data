name: Regenerate campground bundle

on:
  schedule:
    - cron: '0 8 1 * *'   # Runs at 08:00, on day 1 of the month - edit this line to change cadence
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Reset DataGen checkpoint/state files (force a fresh pull every run)
        run: rm -f DataGen/data/recareas.ndjson DataGen/data/recareas.checkpoint DataGen/data/facilities.ndjson DataGen/data/facilities.checkpoint DataGen/data/facility_links.ndjson

      - name: Run DataGen
        working-directory: DataGen
        run: dotnet run -- ${{ secrets.RIDB_API_KEY }}

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- DataGen/data
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Automated: regenerate campground bundle ($(date -u +%Y-%m-%d))"
          git push
